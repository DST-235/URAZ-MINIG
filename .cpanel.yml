---
deployment:
  tasks:
    - /bin/cp -R /home/YOUR_CPANEL_USER/Uraz-Web-repo/. /home/YOUR_CPANEL_USER/public_html/YOUR_DOMAIN/
    - php /home/YOUR_CPANEL_USER/public_html/YOUR_DOMAIN/artisan migrate --force
    - php /home/YOUR_CPANEL_USER/public_html/YOUR_DOMAIN/artisan cache:clear
    - php /home/YOUR_CPANEL_USER/public_html/YOUR_DOMAIN/artisan config:clear
    - php /home/YOUR_CPANEL_USER/public_html/YOUR_DOMAIN/artisan view:clear
